<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Carro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            font-family: "Verdana", sans-serif;
        }
        .btn {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .botao-azul {
            background-color: #003cb3;
            color: white;
        }

        .botao-azul:hover {
            background-color: #003cb3;
            color: white;
        }
    </style>
</head>
<body style="background-color: #b3cce6; min-height: 100vh;">

<div class="container mt-5">

    <h2 class="text-center mb-5 fw-medium" th:text="${carro.id == null ? 'Cadastrar Carro' : 'Editar Carro'}"></h2>

<div th:if="${erro}"
     class="alert alert-danger mx-auto"
     style="max-width: 300px;"
     th:text="${erro}">
</div>

<div class="mx-auto" style="max-width: 250px">
<form th:action="@{/carros/salvar}" th:object="${carro}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label ms-3">Marca:</label>
        <input type="text" th:field="*{marca}" class="form-control">
        <span class="text-danger"
              th:if="${#fields.hasErrors('marca')}"
              th:errors="*{marca}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label ms-3">Modelo:</label>
        <input type="text" th:field="*{modelo}" class="form-control">
        <span class="text-danger"
              th:if="${#fields.hasErrors('modelo')}"
              th:errors="*{modelo}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label ms-3">Ano:</label>
        <input type="number" th:field="*{ano}" class="form-control">
        <span class="text-danger"
              th:if="${#fields.hasErrors('ano')}"
              th:errors="*{ano}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label ms-3">Placa:</label>
        <input type="text" th:field="*{placa}" class="form-control">
        <span class="text-danger"
              th:if="${#fields.hasErrors('placa')}"
              th:errors="*{placa}"></span>
    </div>

    <div class="mb-3">
        <label class="form-label ms-3">Cor (opcional):</label>
        <input type="text" th:field="*{cor}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label ms-3">Preço:</label>
        <input type="number" step="0.01" th:field="*{preco}" class="form-control">
        <span class="text-danger"
              th:if="${#fields.hasErrors('preco')}"
              th:errors="*{preco}"></span>
    </div>

    <div class="d-flex justify-content-center gap-4 mt-4">
        <button type="submit" class="btn botao-azul">Salvar</button>

        <a th:href="@{/carros}" class="btn btn-outline-secondary">Voltar</a>
    </div>

</form>
</div>
</div>
</body>
</html>
