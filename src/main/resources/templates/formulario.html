<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Carro</title>
</head>
<body>

<h1>Cadastrar Carro</h1>

<p th:if="${erro}" th:text="${erro}"></p>

<form th:action="@{/carros/salvar}" th:object="${carro}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Marca:</label>
    <input type="text" th:field="*{marca}">
    <span th:if="${#fields.hasErrors('marca')}"
          th:errors="*{marca}"></span>
    <br><br>

    <label>Modelo:</label>
    <input type="text" th:field="*{modelo}">
    <span th:if="${#fields.hasErrors('modelo')}"
          th:errors="*{modelo}"></span>
    <br><br>

    <label>Ano:</label>
    <input type="number" th:field="*{ano}">
    <span th:if="${#fields.hasErrors('ano')}"
          th:errors="*{ano}"></span>
    <br><br>

    <label>Placa:</label>
    <input type="text" th:field="*{placa}">
    <span th:if="${#fields.hasErrors('placa')}"
          th:errors="*{placa}"></span>
    <br><br>

    <label>Cor:</label>
    <input type="text" th:field="*{cor}">
    <br><br>

    <label>Preço:</label>
    <input type="number" step="0.01" th:field="*{preco}">
    <span th:if="${#fields.hasErrors('preco')}"
          th:errors="*{preco}"></span>
    <br><br>

    <button type="submit">Salvar</button>

</form>

</body>
</html>
