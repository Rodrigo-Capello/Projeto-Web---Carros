<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Carro</title>
</head>
<body>

<h1>Cadastrar Carro</h1>

<form th:action="@{/carros/salvar}" th:object="${carro}" method="post">

    <label>Marca:</label>
    <input type="text" th:field="*{marca}">
    <br><br>

    <label>Modelo:</label>
    <input type="text" th:field="*{modelo}">
    <br><br>

    <label>Ano:</label>
    <input type="number" th:field="*{ano}">
    <br><br>

    <label>Cor:</label>
    <input type="text" th:field="*{cor}">
    <br><br>

    <label>Preço:</label>
    <input type="number" step="0.01" th:field="*{preco}">
    <br><br>

    <button type="submit">Salvar</button>

</form>

</body>
</html>
